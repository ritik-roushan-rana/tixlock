# Push backend -> deploy to Railway.
#
# Why this exists rather than Railway's native GitHub auto-deploy: the Railway service
# has this repo recorded as its source, but no deploy trigger and no webhook on the repo,
# so pushes to main never built anything. The service sat on one commit for a whole day
# while five landed on main. Creating that trigger means authorising Railway's GitHub App
# in a browser; this workflow gets the same outcome from CI, and keeps working regardless
# of the App's state.
#
# Deploys are gated on the test suite. A backend that reaches production without its
# 265 tests having passed is not worth the few minutes saved.
name: Deploy backend to Railway

on:
  push:
    branches: [main]
    # Frontend-only pushes should not rebuild the API. Vercel handles those.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# A second push while one deploy is in flight should supersede it, not race it — two
# `railway up` runs finishing out of order would leave the older build live.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # Single source of truth for the deploy target, so the link and deploy steps cannot
  # drift apart. Verified against `railway status`: project tixlock-backend,
  # environment production, service tixlock-api with root directory `backend`.
  RAILWAY_PROJECT_ID: 680b5012-2cc2-439a-b6d0-3f08942eeb96
  RAILWAY_ENVIRONMENT: production
  RAILWAY_SERVICE: tixlock-api
  # Pinned to the major verified locally (5.43.1). The previous pin was `@4`, which
  # still resolves and whose flags are correct, but it trails the current release.
  RAILWAY_CLI_VERSION: '5'

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_booking_test
        ports: ['5432:5432']
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The application targets Node 20; only the action runtimes moved to 24.
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # No migrate step: tests/globalSetup.js calls reset() and rebuilds the schema
      # once per run, and it refuses to touch a URL without "test" in it.
      - name: Test
        working-directory: backend
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticket_booking_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
          # Deliberately no mail configuration. NODE_ENV=test forces the console
          # transport anyway, but leaving these unset means a regression in that guard
          # cannot quietly start mailing fixture addresses from CI.
        run: npm test

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest

    env:
      # Both are passed through; the CLI uses whichever is set. A project token
      # (RAILWAY_TOKEN) already implies project + environment, so it needs no linking.
      # An account token (RAILWAY_API_TOKEN) can reach every project and must be told
      # which one. Neither is ever echoed.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install the Railway CLI
        run: |
          npm i -g @railway/cli@${RAILWAY_CLI_VERSION}
          railway --version

      # This is the step that failed before, with a bare "exit code 1" whose only clue
      # was one line of CLI output. The token in use was a rotating CLI *session* token,
      # which the local CLI silently refreshed, leaving the stored secret dead. Checking
      # auth up front turns that class of failure into a message that says what to do.
      - name: Check Railway authentication
        run: |
          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway token. Add a repository secret named RAILWAY_TOKEN"\
                 "(project token: Railway -> project -> Settings -> Tokens) or"\
                 "RAILWAY_API_TOKEN (account token: Railway -> Account Settings -> Tokens)."
            exit 1
          fi
          if ! railway whoami; then
            echo "::error::Railway rejected the token. It is missing, expired, revoked, or"\
                 "lacks access to project ${RAILWAY_PROJECT_ID}. Mint a fresh token in the"\
                 "Railway dashboard and update the repository secret. Note that a CLI"\
                 "session token from ~/.railway/config.json rotates and will not survive."
            exit 1
          fi

      # No `railway link` step. That was the step that failed, and it turns out to be
      # unnecessary: `up` takes --project/--environment/--service directly, so the target
      # is stated in the one command that needs it. Linking wrote CLI state to $HOME
      # purely so a later command could read it back — an extra failure point, and one
      # that cannot work with a project token because that credential cannot enumerate
      # projects.
      #
      # Run from the repository root, not backend/: the service's root directory is
      # `backend` and Railway applies that to whatever upload context it is given, so
      # deploying from backend/ makes it look for backend/backend and the build fails.
      - name: Deploy
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE" \
            --ci

      - name: Verify the deployed service is healthy
        # Confirms the new container is actually serving, and reports which mail
        # transport it came up with — the field /api/health exposes for exactly this.
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS https://tixlock-api-production.up.railway.app/api/health) && {
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            }
            echo "attempt $i: not healthy yet"
            sleep 10
          done
          echo "::error::service did not report healthy after 2 minutes"
          exit 1
